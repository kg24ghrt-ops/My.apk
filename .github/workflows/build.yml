name: Build Psiphon Android
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Temporarily comment out the cache to fix the "Zip" error
          # cache: 'gradle' 

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.2.9519653' 

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Android APK
        # Added 'clean' and '--refresh-dependencies' to kill corrupted zips
        run: ./gradlew clean assembleDebug --refresh-dependencies --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Psiphon-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
