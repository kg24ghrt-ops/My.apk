name: Psiphon CI Build (Stable)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.2

      - name: Install missing SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-33"

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Clear corrupted Gradle transforms cache
        run: rm -rf ~/.gradle/caches/transforms-* || true

      - name: Fix permissions
        run: chmod +x gradlew

      - name: Clean project
        run: ./gradlew clean

      - name: Build with full logs
        run: ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: psiphon-debug
          path: app/build/outputs/apk/debug/*.apk